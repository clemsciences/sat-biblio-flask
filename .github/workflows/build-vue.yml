name: build-vue

on:
  push:
  pull_request:
    branches: [ "master" ]

defaults:
  run:
    working-directory: sat-biblio-interface

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: "Setup Node JS"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sat-biblio-interface/package-lock.json

      - name: "Install packages"
        run: npm ci

      - name: "Lint"
        run: npx eslint . --ext .vue,.js,.jsx,.cjs,.mjs --ignore-path .gitignore

      - name: "Unit tests (Vitest)"
        run: npm run test:run

      - name: "Build project"
        run: npm run build

      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: satbiblio-vue
          path: sat-biblio-interface/satbiblio-dist

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: "Setup Node JS"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sat-biblio-interface/package-lock.json

      - name: "Install packages"
        run: npm ci

      - name: "Install Playwright browsers"
        run: npx playwright install --with-deps chromium

      - name: "End-to-end tests (Playwright)"
        run: npm run test:e2e

      - name: "Upload Playwright report"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: sat-biblio-interface/playwright-report
          retention-days: 7
