services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    volumes:
      - sat_biblio_data:/app/data
      - sat_biblio_uploads:/app/uploads
    environment:
      - DATA_DIR=/app/data
      - UPLOAD_DIR=/app/uploads
      - SQLALCHEMY_DATABASE_URI=sqlite:////app/data/data-prod.sqlite3
      - SECRET_KEY=change-me-in-production
      - JWT_SECRET_KEY=change-me-too
      - EMAIL_ADDRESS=admin@example.com
      - MAIL_PASSWORD=password
      # The production config pins SERVER_NAME to api.satbiblio.clementbesnier.eu, and
      # Flask then 404s every request whose Host header differs. Empty disables that
      # check so the API answers on http://localhost:5000/.
      - SERVER_NAME=
      # Must match the origin the browser loads the SPA from (the `interface` service),
      # otherwise the browser blocks every cross-origin API call.
      - CORS_ORIGINS=http://localhost:8085
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

  interface:
    build:
      context: ./sat-biblio-interface
      args:
        # Vite, not Vue CLI: the variable MUST be named VITE_APP_SITE_API_URL, and it
        # is baked into the bundle at build time — changing it requires a rebuild
        # (`docker compose build interface`), not just a restart.
        # No /api suffix: services/api.js calls paths like /users/connect/ directly on
        # this baseURL.
        - VITE_APP_SITE_API_URL=http://localhost:5000/
    ports:
      - "8085:8080"
    restart: always
    depends_on:
      api:
        condition: service_healthy

volumes:
  sat_biblio_data:
  sat_biblio_uploads:
