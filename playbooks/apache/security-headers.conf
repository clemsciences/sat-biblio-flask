# En-têtes de sécurité pour l'interface (bht.societearcheotouraine.fr).
#
# À inclure dans le VirtualHost *:443 qui sert satbiblio-dist :
#
#     Include /home/debian/sat-biblio-flask-vue3/playbooks/apache/security-headers.conf
#
# puis :
#
#     sudo a2enmod headers
#     sudo apachectl configtest
#     sudo systemctl reload apache2
#
# L'API (api.satbiblio.clementbesnier.eu) n'en a pas besoin : Flask pose
# lui-même ses en-têtes (voir add_security_headers dans sat_biblio_server/__init__.py).

<IfModule mod_headers.c>
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Un an. Ne pas ajouter includeSubDomains sans avoir vérifié que tous les
    # sous-domaines de societearcheotouraine.fr sont servis en https.
    Header always set Strict-Transport-Security "max-age=31536000"

    # CSP en observation : rien n'est bloqué, chaque violation est envoyée à
    # l'API et apparaît dans le journal du serveur (« Violation CSP : … »).
    # Après deux semaines sans violation légitime, remplacer
    # « Content-Security-Policy-Report-Only » par « Content-Security-Policy ».
    # Si la recherche dans les bulletins affiche des images d'une autre origine,
    # l'ajouter à img-src.
    Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https://api.satbiblio.clementbesnier.eu https://api.github.com; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; report-uri https://api.satbiblio.clementbesnier.eu/csp-report/"
</IfModule>
