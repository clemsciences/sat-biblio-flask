server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Support for Vue Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets. Pas de add_header ici : un add_header dans un bloc
    # location annule l'héritage de ceux du bloc server (en-têtes de sécurité
    # ci-dessous). « expires » pose déjà Cache-Control: max-age.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # Security headers ("always" : aussi sur les réponses d'erreur)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP en observation (Report-Only) : les violations apparaissent dans la
    # console du navigateur sans rien bloquer. connect-src accepte toute API en
    # https ou sur localhost, l'URL de l'API étant fixée au build. La version de
    # production, plus stricte, est dans playbooks/apache/security-headers.conf.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' https: http://localhost:*; frame-src https://www.youtube.com https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
}
